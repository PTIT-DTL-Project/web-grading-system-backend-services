name: Publish Docker Images

on:
  workflow_run:
    workflows: ["Build and Test Services"]
    types:
      - completed
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  CONFIG_REPO: PTIT-DTL-Project/web-grading-system-services-config

jobs:
  detect-changes:
    name: Get Changed Services
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-changes.outputs.matrix }}
    steps:
      - name: Download changed services artifact
        id: get-changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "Downloading artifact from workflow run: $RUN_ID"

          # Download the artifact using GitHub API
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "changed-services") | .id' > artifact_id.txt

          ARTIFACT_ID=$(cat artifact_id.txt)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No 'changed-services' artifact found from build run $RUN_ID"
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found artifact ID: $ARTIFACT_ID"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          unzip -o artifact.zip -d artifact/

          if [ -f "artifact/changed-services.json" ]; then
            MATRIX=$(cat artifact/changed-services.json)
            echo "Changed services: $MATRIX"
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          else
            echo "::error::changed-services.json not found in artifact"
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"service":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "${{ matrix.service }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="v1.0.0"
          else
            VERSION_NUM=$(echo "$LATEST_TAG" | sed "s/${{ matrix.service }}-v//")
            IFS='.' read -ra PARTS <<< "$VERSION_NUM"
            PATCH=$((PARTS[2] + 1))
            VERSION="v${PARTS[0]}.${PARTS[1]}.$PATCH"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Auto-incremented version: $VERSION"

      - name: Build with Maven
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests -U

      - name: Create GitHub Release with JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.service }}-${{ steps.version.outputs.VERSION }}"
          # Create the release via the GitHub API (gh release create) instead
          # of a raw git push. When the tagged commit touches files under
          # .github/workflows/, GitHub requires the workflows:write App
          # permission — which we grant in the `permissions` block above.
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" ${{ matrix.service }}/target/*.jar --clobber
          else
            gh release create "$TAG" \
              --title "${{ matrix.service }} ${{ steps.version.outputs.VERSION }}" \
              ${{ matrix.service }}/target/*.jar
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/web-grading-system-${{ matrix.service }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKERHUB_USERNAME }}/web-grading-system-${{ matrix.service }}:latest

  update-config:
    name: Update Config Repo
    needs: [detect-changes, publish]
    if: needs.detect-changes.outputs.matrix != '{"service":[]}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-download changed services artifact
        id: get-changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "changed-services") | .id' > artifact_id.txt
          ARTIFACT_ID=$(cat artifact_id.txt)
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          unzip -o artifact.zip -d artifact/
          echo "Services to update:"
          cat artifact/changed-services.json
          # Extract service names for looping
          jq -r '.service[]' artifact/changed-services.json > /tmp/services.txt
          cat /tmp/services.txt

      - name: Update config repo
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          # Pre-compute versions from source repo tags BEFORE cloning config repo
          # (source repo was checked out at the start of this job with fetch-depth: 0)
          declare -A SVC_VERSIONS
          for svc in $(cat /tmp/services.txt); do
            LATEST_TAG=$(git tag -l "${svc}-v*" --sort=-v:refname | head -n1)
            if [ -z "$LATEST_TAG" ]; then
              VERSION="v1.0.0"
            else
              VERSION=${LATEST_TAG#${svc}-}
            fi
            SVC_VERSIONS["$svc"]="$VERSION"
            echo "Version for $svc: $VERSION"
          done

          echo "Cloning config repo: ${{ env.CONFIG_REPO }}"
          git clone https://x-access-token:$GH_TOKEN@github.com/${{ env.CONFIG_REPO }}.git config-repo || {
            echo "::error::Failed to clone config repo. Check CONFIG_REPO and CONFIG_REPO_TOKEN secrets."
            exit 1
          }
          cd config-repo
          git config user.email "ci@grading-platform.com"
          git config user.name "GitHub CI"

          # Loop through each changed service serially
          for svc in $(cat /tmp/services.txt); do
            echo "=== Processing service: $svc ==="

            VERSION="${SVC_VERSIONS[$svc]}"

            VALUES_FILE="${svc}/values-stg.yaml"

            if [ -f "$VALUES_FILE" ]; then
              echo "Updating $VALUES_FILE with version $VERSION"
              echo "Before:"
              grep "tag:" "$VALUES_FILE" || true

              sed -i "s|tag: .*|tag: \"${VERSION}\"|" "$VALUES_FILE"

              echo "After:"
              grep "tag:" "$VALUES_FILE" || true

              git add "$VALUES_FILE"
            else
              echo "::warning::Config file $VALUES_FILE not found in config repo, skipping"
            fi
          done

          git diff --staged --quiet || {
            git commit -m "chore: update image tags for changed services"
            git push
            echo "✅ Config repo updated with new image tags"
          } || echo "No config changes to commit"
