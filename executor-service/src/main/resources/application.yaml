server:
  port: 8083

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security-protocol: SASL_SSL
    sasl-mechanism: SCRAM-SHA-256
    sasl-jaas-config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_USERNAME:}\" password=\"${KAFKA_PASSWORD:}\";"
    ssl-endpoint-identification-algorithm: https
    ssl-truststore-type: PEM
    ssl-truststore-location: ${KAFKA_CA_PATH:docker/kafka-ca.pem}
    group-id: executor-group
    enable-auto-commit: true
    auto-offset-reset: earliest
    max-poll-records: 1
    ack-mode: RECORD
  application:
    name: executor-service
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:executor_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration


executor:
  temp-dir: ${EXECUTOR_TEMP_DIR:/tmp/grading}
  container:
    startup-timeout-ms: ${EXECUTOR_STARTUP_TIMEOUT_MS:60000}
    max-execution-time-ms: ${EXECUTOR_MAX_EXECUTION_MS:300000}
  reaper:
    # must exceed startup + execution timeouts (6 min) or live jobs get double-graded;
    # RUNNING jobs are never reaped (see StaleJobReaper), so this only guards
    # PENDING/FETCHING/BUILDING
    stale-after-minutes: ${EXECUTOR_REAPER_STALE_AFTER_MINUTES:30}
    interval-ms: ${EXECUTOR_REAPER_INTERVAL_MS:300000}
    max-attempts: ${EXECUTOR_REAPER_MAX_ATTEMPTS:3}

rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
  public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${RUSTFS_ACCESS_KEY:minioadmin}
  secret-key: ${RUSTFS_SECRET_KEY:minioadmin}
  bucket-name: ${RUSTFS_BUCKET_NAME:submission-files}

feign:
  course-service:
    url: ${COURSE_SERVICE_URL:http://grading-course-service:8081}
  submission-service:
    url: ${SUBMISSION_SERVICE_URL:http://grading-submission-service:8082}
  result-service:
    url: ${RESULT_SERVICE_URL:http://grading-result-service:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
    # OTLP push disabled — set to true to re-enable
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://alloy.observability.svc.cluster.local:4318/v1/traces}
  otlp:
    metrics:
      # OTLP metrics push disabled — set to true to re-enable
      export:
        enabled: false
        url: ${OTLP_METRICS_ENDPOINT:http://alloy.observability.svc.cluster.local:4318/v1/metrics}
        step: 30s

logging:
  level:
    root: INFO
    vn.edu.ptit.web_grading_system: ${app.log.level:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"

# Pyroscope continuous profiling
pyroscope:
  enabled: true
  endpoint: ${PYROSCOPE_ENDPOINT:http://pyroscope.observability.svc.cluster.local:4100}
  application-name: ${spring.application.name}
  labels:
    region: ${REGION:dev}
    cluster: ${CLUSTER:dev}

# Shared events topic (single topic for the whole system — Aiven free tier = 5 topics)
wgs:
  events:
    topic: wgs-events
