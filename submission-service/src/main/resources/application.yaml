server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_USERNAME:}\" password=\"${KAFKA_PASSWORD:}\";"
      ssl.endpoint.identification.algorithm: https
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_CA_PATH:docker/kafka-ca.pem}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
  application:
    name: submission-service
    description: Submission Service - Handles code submission operations for Web Grading System
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:submission_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration


rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
  public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${RUSTFS_ACCESS_KEY:minioadmin}
  secret-key: ${RUSTFS_SECRET_KEY:minioadmin}
  bucket-name: ${RUSTFS_BUCKET_NAME:submission-files}

submission:
  presigned-url-expiry-minutes: ${PRESIGNED_URL_EXPIRY_MINUTES:15}

feign:
  course-service:
    url: ${FEIGN_COURSE_SERVICE_URL:http://grading-course-service:8081}

# Shared events topic (single topic for the whole system — Aiven free tier = 5 topics)
wgs:
  events:
    topic: wgs-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
    web:
      exclude-patterns: /actuator/health,/actuator/prometheus,/actuator/info,/actuator/**
    # OTLP push to Tempo — enabled so traces are exported from this service.
    export:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://tempo.observability.svc.cluster.local:4318/v1/traces}
  otlp:
    metrics:
      # Prometheus pulls /actuator/prometheus; do not also push to OTLP.
      export:
        enabled: false

logging:
  level:
    root: INFO
    vn.edu.ptit.web_grading_system: ${app.log.level:INFO}
    org.springframework.web: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# Secret the API Gateway stamps as X-Gateway-Secret on every forwarded request.
# HeaderAuthenticationFilter only builds a SecurityContext when it matches;
# blank means fail closed (401), never "no secret configured = trust everyone".
gateway:
  security:
    secret: ${GATEWAY_TRUSTED_SECRET:}
