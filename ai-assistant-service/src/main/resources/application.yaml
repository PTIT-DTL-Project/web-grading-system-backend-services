server:
  port: 8086

spring:
  application:
    name: ai-assistant-service
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Slow course/result/LLM-adjacent reads must fail fast into fallbacks instead
  # of holding request threads up to Feign's 60s default read timeout.
  # Prefix verified: spring.cloud.openfeign.client — legacy feign.client.config
  # silently binds nothing.
  cloud:
    openfeign:
      client:
        config:
          course-service:
            connectTimeout: 2000
            readTimeout: 3000
          result-service:
            connectTimeout: 2000
            readTimeout: 3000
  ai:
    openai:
      api-key: ${AI_AGENT_API_KEY:${AI_API_KEY:dummy-key-for-local-and-test}}
      base-url: ${AI_AGENT_BASE_URL:${AI_BASE_URL:https://api.openai.com/v1}}
      chat:
        options:
          model: ${AI_AGENT_MODEL_NAME:${AI_MODEL_NAME:gpt-4o-mini}}
          # Agent chat không giới hạn max-completion-tokens: để LLM tự quyết định độ dài đầu ra.
          # Giới hạn max-completion-tokens chỉ áp dụng cho ai.explanation qua ai.explanation.max-completion-tokens.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Send OTLP traces directly to Tempo (no Alloy intermediary).
      endpoint: ${OTLP_TRACES_ENDPOINT:http://tempo.observability.svc.cluster.local:4318/v1/traces}
      transport: http

gateway:
  security:
    secret: ${GATEWAY_TRUSTED_SECRET:}

# Service-to-service endpoints (Feign) — env-overridable for local runs
feign:
  result-service:
    url: ${RESULT_SERVICE_URI:http://grading-result-service:8084}
  course-service:
    url: ${COURSE_SERVICE_URI:http://grading-course-service:8081}

ai:
  model:
    provider: ${AI_PROVIDER:openai}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL_NAME:gpt-4o-mini}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  agent:
    provider: ${AI_AGENT_PROVIDER:${AI_PROVIDER:openai}}
    api-key: ${AI_AGENT_API_KEY:${AI_API_KEY:}}
    model-name: ${AI_AGENT_MODEL_NAME:${AI_MODEL_NAME:gpt-4o-mini}}
    base-url: ${AI_AGENT_BASE_URL:${AI_BASE_URL:https://api.openai.com/v1}}
  explanation:
    provider: ${AI_EXPLAIN_PROVIDER:${AI_PROVIDER:openai}}
    api-key: ${AI_EXPLAIN_API_KEY:${AI_API_KEY:}}
    model-name: ${AI_EXPLAIN_MODEL_NAME:${AI_MODEL_NAME:gpt-4o-mini}}
    base-url: ${AI_EXPLAIN_BASE_URL:${AI_BASE_URL:https://api.openai.com/v1}}
    max-completion-tokens: ${AI_EXPLAIN_MAX_COMPLETION_TOKENS:8092}

agent:
  limits:
    max-model-steps: ${AGENT_MAX_MODEL_STEPS:8}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:12}
    max-model-attempts: ${AGENT_MAX_MODEL_ATTEMPTS:16}
    max-validation-repairs: ${AGENT_MAX_VALIDATION_REPAIRS:3}
    max-lookup-rounds: ${AGENT_MAX_LOOKUP_ROUNDS:2}
    active-timeout-seconds: ${AGENT_ACTIVE_TIMEOUT_SECONDS:120}
  retry:
    model-max-retries: ${AGENT_MODEL_MAX_RETRIES:2}
    safe-tool-max-retries: ${AGENT_SAFE_TOOL_MAX_RETRIES:2}
  context:
    max-input-tokens: ${AGENT_MAX_INPUT_TOKENS:26000}
    output-reserve: ${AGENT_OUTPUT_RESERVE:4000}
    safety-margin: ${AGENT_SAFETY_MARGIN:2000}
    history-window-size: ${AGENT_HISTORY_WINDOW_SIZE:10}
    tool-search-limit: ${AGENT_TOOL_SEARCH_LIMIT:5}
    history-max-tokens: ${AGENT_HISTORY_MAX_TOKENS:12000}
    tool-max-tokens: ${AGENT_TOOL_MAX_TOKENS:6000}
    stored-tool-result-ttl-minutes: ${AGENT_STORED_TOOL_RESULT_TTL_MINUTES:60}

