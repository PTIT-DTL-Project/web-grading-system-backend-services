server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ptit-wgs}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: course-service
              uri: ${COURSE_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/classes/**,/api/v1/assignments/**,/api/v1/docker-images/**,/api/v1/student/**
            - id: submission-service
              uri: ${SUBMISSION_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/submissions/**
            - id: result-service
              uri: ${RESULT_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/results/**

# Trust settings stamped on every forwarded request by api-gateway.
#   secret        -> X-Gateway-Secret; services refuse to build a SecurityContext without
#                    it. Blank default = fail closed (401).
#   allowedRoles  -> filters Keycloak realm_access.roles before they become X-User-Roles.
#                    Policy, not a secret, so the default lives here; an empty list means
#                    no role is ever forwarded and every @PreAuthorize answers 403.
gateway:
  security:
    secret: ${GATEWAY_TRUSTED_SECRET:}
    allowed-roles: ${GATEWAY_ALLOWED_ROLES:ROLE_LECTURER,ROLE_STUDENT}

# Keycloak credentials for the self-service change-password endpoint (UC-14).
#   admin-client-*      -> confidential service account (wgs-user-service) for the admin
#                          API; the secret lives only in the K8s Secret, never in the FE.
#   password-client-*   -> client whose password grant verifies the current password.
#                          Phase 3 (2026-10-03, D11): the confidential wgs-password-verify
#                          + its secret, because Direct Access Grants are OFF on
#                          web-grading-fe since 2026-10-03 — the gateway can no longer
#                          reuse the browser client for this grant. The default id is
#                          wgs-password-verify for that reason (it used to default to
#                          web-grading-fe, which now yields unauthorized_client -> 502).
#                          SECRET DEFAULT IS BLANK: a blank secret sends no client_secret
#                          on the wire, and against a confidential client that fails
#                          unauthorized_client -> 502 identity_provider_unavailable.
#                          That is deliberate fail-loud: set KEYCLOAK_PASSWORD_CLIENT_SECRET
#                          (runbook §10.2) instead of expecting an old public-client
#                          fallback — that fallback is dead while fe direct grants are off.
# The admin base URI is derived from issuer-uri in code (no separate config key), so this
# issuer MUST default to the SAME value as spring.security.oauth2.resourceserver.jwt.issuer-uri
# above: with two different fallbacks an unset KEYCLOAK_ISSUER_URI would validate JWTs
# against one Keycloak while sending end-user passwords to another.
keycloak:
  admin:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ptit-wgs}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:wgs-user-service}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    password-client-id: ${KEYCLOAK_PASSWORD_CLIENT_ID:wgs-password-verify}
    password-client-secret: ${KEYCLOAK_PASSWORD_CLIENT_SECRET:}

# Exposure switch for POST /api/v1/account/change-password (UC-14). NO rate limiter is
# implemented yet — this does NOT throttle anything; it only decides whether the
# controller is registered at all. Default false = an unconfigured deployment never
# exposes an anonymous password-verification oracle (the path answers 404). A deployment
# opts in with RATE_LIMIT_ENABLED=true only once realm brute-force protection is confirmed
# (runbook §3: bruteForceProtected=true). The real limiter is a follow-up change.
# Review: 2026-10-04, Pullfrog review (unthrottled public endpoint).
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
    # OTLP push disabled — set to true to re-enable
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://alloy.observability.svc.cluster.local:4318/v1/traces}
  otlp:
    metrics:
      # OTLP metrics push disabled — set to true to re-enable
      export:
        enabled: false
        url: ${OTLP_METRICS_ENDPOINT:http://alloy.observability.svc.cluster.local:4318/v1/metrics}
        step: 30s

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"

# Pyroscope continuous profiling
pyroscope:
  enabled: true
  endpoint: ${PYROSCOPE_ENDPOINT:http://pyroscope.observability.svc.cluster.local:4100}
  application-name: ${spring.application.name}
  labels:
    region: ${REGION:dev}
    cluster: ${CLUSTER:dev}
