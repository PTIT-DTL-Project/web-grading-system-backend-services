server:
  port: 8081

spring:
  application:
    name: course-service
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assignment_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
    # OTLP push to Tempo — enabled so traces are exported from this service.
    export:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://tempo.observability.svc.cluster.local:4318/v1/traces}
  otlp:
    metrics:
      # Prometheus pulls /actuator/prometheus; do not also push to OTLP.
      export:
        enabled: false

logging:
  level:
    root: INFO
    vn.edu.ptit.web_grading_system: ${app.log.level:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# Service-to-service endpoints (Feign) — env-overridable for local runs
feign:
  result-service:
    url: ${RESULT_SERVICE_URI:http://grading-result-service:8084}
  submission-service:
    url: ${SUBMISSION_SERVICE_URI:http://grading-submission-service:8082}
  executor-service:
    url: ${EXECUTOR_SERVICE_URI:http://localhost:8083}

# Secret the API Gateway stamps as X-Gateway-Secret on every forwarded request.
# HeaderAuthenticationFilter only builds a SecurityContext when it matches;
# blank means fail closed (401), never "no secret configured = trust everyone".
gateway:
  security:
    secret: ${GATEWAY_TRUSTED_SECRET:}
