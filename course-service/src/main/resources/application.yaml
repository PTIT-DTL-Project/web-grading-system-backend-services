server:
  port: 8081

spring:
  application:
    name: course-service
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assignment_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
    # OTLP push disabled — set to true to re-enable
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://alloy.observability.svc.cluster.local:4318/v1/traces}
  otlp:
    metrics:
      # OTLP metrics push disabled — set to true to re-enable
      export:
        enabled: false
        url: ${OTLP_METRICS_ENDPOINT:http://alloy.observability.svc.cluster.local:4318/v1/metrics}
        step: 30s

logging:
  level:
    vn.edu.ptit.web_grading_system: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"

# Service-to-service endpoints (Feign) — env-overridable for local runs
feign:
  result-service:
    url: ${RESULT_SERVICE_URI:http://grading-result-service:8084}

# Pyroscope continuous profiling
pyroscope:
  enabled: true
  endpoint: ${PYROSCOPE_ENDPOINT:http://pyroscope.observability.svc.cluster.local:4100}
  application-name: ${spring.application.name}
  labels:
    region: ${REGION:dev}
    cluster: ${CLUSTER:dev}
