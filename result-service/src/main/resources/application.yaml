server:
  port: 8084

spring:
  application:
    name: result-service
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:result_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Review: 2026-10-10, Pullfrog — scoring reads call course-service from
  # inside the read path (pool: 10 Hikari connections). A slow course must
  # fail fast into carried-weight fallback instead of holding connections
  # up to Feign's 60s default read timeout. Steady state rarely calls at
  # all (5-minute weight cache), so these only bound the miss/outage window.
  # Prefix verified against spring-cloud-openfeign-core 5.0.2 bytecode:
  # FeignClientProperties binds "spring.cloud.openfeign.client" — the
  # legacy "feign.client.config" prefix silently binds nothing (2026-10-10).
  cloud:
    openfeign:
      client:
        config:
          course-service:
            connectTimeout: 2000
            readTimeout: 3000


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
    # OTLP push to Tempo — enabled so traces are exported from this service.
    export:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://tempo.observability.svc.cluster.local:4318/v1/traces}
  otlp:
    metrics:
      # Prometheus pulls /actuator/prometheus; do not also push to OTLP.
      export:
        enabled: false

logging:
  level:
    root: INFO
    vn.edu.ptit.web_grading_system: ${app.log.level:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

# Service-to-service endpoints (Feign) — env-overridable for local runs
feign:
  course-service:
    url: ${COURSE_SERVICE_URI:http://grading-course-service:8081}

# Secret the API Gateway stamps as X-Gateway-Secret on every forwarded request.
# HeaderAuthenticationFilter only builds a SecurityContext when it matches;
# blank means fail closed (401), never "no secret configured = trust everyone".
gateway:
  security:
    secret: ${GATEWAY_TRUSTED_SECRET:}
